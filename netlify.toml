[build]
command = "npm run build && npm run check:output"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/media/*"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
